<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Định vị RX — Newton 3 TX</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --accent: #58a6ff; --ok: #3fb950; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    h1 { margin: 0; font-size: 1.25rem; }
    main { padding: 1rem 1.5rem; display: grid; gap: 1rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .row-2 { display: grid; grid-template-columns: 1fr minmax(280px, 340px); gap: 1rem; align-items: stretch; }
    .coords { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; }
    label { display: block; font-size: 0.75rem; color: #8b949e; }
    input { width: 100%; padding: 0.4rem; border-radius: 6px; border: 1px solid var(--border); background: #0d1117; color: var(--text); font-size: 0.85rem; }
    pre { margin: 0; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; }
    button { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; background: var(--accent); color: #0d1117; font-weight: 600; }
    a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    canvas.corr { max-height: 320px; }
    .radar-wrap { display: flex; flex-direction: column; gap: 0.5rem; height: 100%; }
    #radar { width: 100%; aspect-ratio: 1; max-height: 320px; background: #0a0f14; border-radius: 8px; border: 1px solid var(--border); }
    .legend { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.75rem; color: #8b949e; }
    .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; vertical-align: middle; }
    .legend .tx::before { background: #58a6ff; }
    .legend .rx::before { background: #f85149; }
    .legend .hint::before { background: #3fb950; }
    @media (max-width: 900px) {
      .grid-3, .row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Bước 2 — Định vị máy thu (Newton)</h1>
      <a class="back" href="/">← Quay lại hiệu chuẩn</a>
    </div>
    <button onclick="updateCoords()">Cập nhật toạ độ TX</button>
  </header>
  <main>
    <section class="panel">
      <h2>Toạ độ trạm phát (lat / lon)</h2>
      <div class="coords" id="coordFields"></div>
    </section>

    <section class="row-2">
      <div class="panel">
        <h2>Kết quả Newton</h2>
        <pre id="newtonOut">Đang chờ dữ liệu…</pre>
      </div>
      <div class="panel radar-wrap">
        <h2>Radar vị trí (m)</h2>
        <canvas id="radar" width="320" height="320"></canvas>
        <div class="legend">
          <span class="tx">TX</span>
          <span class="rx">RX ước lượng</span>
          <span class="hint">RX tham chiếu</span>
        </div>
      </div>
    </section>

    <section class="panel grid-3" id="corrCharts"></section>
  </main>
  <script>
    const COORD_KEYS = ['TX1_lat','TX1_lon','TX2_lat','TX2_lon','TX3_lat','TX3_lon'];
    const charts = [];
    const radar = document.getElementById('radar');
    const rctx = radar.getContext('2d');
    let sweepAngle = 0;

    function buildCoordForm(defaults) {
      const box = document.getElementById('coordFields');
      box.innerHTML = '';
      COORD_KEYS.forEach(k => {
        const d = document.createElement('div');
        d.innerHTML = `<label>${k.replace('_',' ')}</label><input id="${k}" type="number" step="any" value="${defaults[k] ?? 0}">`;
        box.appendChild(d);
      });
    }

    function initCharts(n) {
      const box = document.getElementById('corrCharts');
      box.innerHTML = '';
      charts.length = 0;
      for (let i = 0; i < n; i++) {
        const wrap = document.createElement('div');
        wrap.innerHTML = `<div style="font-size:0.85rem;margin-bottom:0.35rem" id="lbl${i}">TX${i+1}</div><canvas class="corr" id="c${i}"></canvas>`;
        box.appendChild(wrap);
        const ctx = document.getElementById(`c${i}`).getContext('2d');
        charts.push(new Chart(ctx, {
          type: 'line',
          data: { labels: [], datasets: [{ data: [], borderWidth: 1, pointRadius: 0, borderColor: '#3fb950' }] },
          options: {
            animation: false, responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              x: { title: { display: true, text: 'Delay (samples)', color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
              y: {
                beginAtZero: true,
                grace: '35%',
                title: { display: true, text: '|corr|', color: '#8b949e' },
                ticks: { color: '#8b949e' },
                grid: { color: '#21262d' }
              }
            }
          }
        }));
      }
    }

    async function updateCoords() {
      const coords = {};
      COORD_KEYS.forEach(k => {
        coords[k] = +document.getElementById(k).value;
      });
      await fetch('/api/geometry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ coords }) });
    }

    function formatNewton(n) {
      if (!n) return 'Đang chờ…';
      let s = '── Pseudorange (bù Delta_m) & Newton ──\n';
      (n.pseudorange || []).forEach((p, i) => {
        s += `TX${i+1}: tau=${n.taus[i]}  P=${p.toFixed(2)} m`;
        if (n.true_dist) s += `  true=${n.true_dist[i].toFixed(2)} m`;
        s += '\n';
      });
      s += `\nx_est = ${n.pos[0].toFixed(3)} m\ny_est = ${n.pos[1].toFixed(3)} m\nb_est = ${n.pos[2].toFixed(3)} m\n`;
      if (n.err_norm != null) s += `\nErr = ${n.err_norm.toFixed(3)} m`;
      return s;
    }

    function drawRadar(txXy, rxEst, rxHint) {
      const w = radar.width;
      const h = radar.height;
      const cx = w / 2;
      const cy = h / 2;
      const pts = [...(txXy || [])];
      if (rxEst) pts.push(rxEst);
      if (rxHint) pts.push(rxHint);

      let maxR = 1;
      for (const p of pts) {
        const r = Math.hypot(p[0], p[1]);
        if (r > maxR) maxR = r;
      }
      maxR *= 1.25;
      const scale = (Math.min(w, h) / 2 - 18) / maxR;

      rctx.clearRect(0, 0, w, h);

      // background disc
      rctx.beginPath();
      rctx.arc(cx, cy, maxR * scale, 0, Math.PI * 2);
      rctx.fillStyle = '#071018';
      rctx.fill();

      // rings + crosshair
      rctx.strokeStyle = '#1f6f4a88';
      rctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        const rr = (maxR * scale * i) / 4;
        rctx.beginPath();
        rctx.arc(cx, cy, rr, 0, Math.PI * 2);
        rctx.stroke();
        rctx.fillStyle = '#3fb95055';
        rctx.font = '10px system-ui';
        rctx.fillText(`${((maxR * i) / 4).toFixed(0)} m`, cx + 4, cy - rr + 10);
      }
      rctx.beginPath();
      rctx.moveTo(cx - maxR * scale, cy);
      rctx.lineTo(cx + maxR * scale, cy);
      rctx.moveTo(cx, cy - maxR * scale);
      rctx.lineTo(cx, cy + maxR * scale);
      rctx.stroke();

      // sweeping wedge
      sweepAngle = (sweepAngle + 0.04) % (Math.PI * 2);
      const grad = rctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * scale);
      grad.addColorStop(0, 'rgba(63,185,80,0.18)');
      grad.addColorStop(1, 'rgba(63,185,80,0)');
      rctx.beginPath();
      rctx.moveTo(cx, cy);
      rctx.arc(cx, cy, maxR * scale, sweepAngle - 0.55, sweepAngle);
      rctx.closePath();
      rctx.fillStyle = grad;
      rctx.fill();
      rctx.beginPath();
      rctx.moveTo(cx, cy);
      rctx.lineTo(cx + Math.cos(sweepAngle) * maxR * scale, cy - Math.sin(sweepAngle) * maxR * scale);
      rctx.strokeStyle = '#3fb950aa';
      rctx.stroke();

      const toPix = (x, y) => [cx + x * scale, cy - y * scale];

      // RX hint
      if (rxHint) {
        const [px, py] = toPix(rxHint[0], rxHint[1]);
        rctx.beginPath();
        rctx.arc(px, py, 7, 0, Math.PI * 2);
        rctx.strokeStyle = '#3fb950';
        rctx.lineWidth = 2;
        rctx.stroke();
        rctx.fillStyle = '#3fb950';
        rctx.font = '11px system-ui';
        rctx.fillText('RX*', px + 8, py - 6);
      }

      // TX markers
      (txXy || []).forEach((p, i) => {
        const [px, py] = toPix(p[0], p[1]);
        rctx.beginPath();
        rctx.moveTo(px, py - 8);
        rctx.lineTo(px + 7, py + 6);
        rctx.lineTo(px - 7, py + 6);
        rctx.closePath();
        rctx.fillStyle = '#58a6ff';
        rctx.fill();
        rctx.fillStyle = '#e6edf3';
        rctx.font = '11px system-ui';
        rctx.fillText(`TX${i + 1}`, px + 8, py + 3);
      });

      // RX estimate
      if (rxEst) {
        const [px, py] = toPix(rxEst[0], rxEst[1]);
        rctx.strokeStyle = '#f85149';
        rctx.lineWidth = 2;
        rctx.beginPath();
        rctx.moveTo(px - 8, py);
        rctx.lineTo(px + 8, py);
        rctx.moveTo(px, py - 8);
        rctx.lineTo(px, py + 8);
        rctx.stroke();
        rctx.beginPath();
        rctx.arc(px, py, 4, 0, Math.PI * 2);
        rctx.fillStyle = '#f85149';
        rctx.fill();
        rctx.fillStyle = '#f85149';
        rctx.font = '11px system-ui';
        rctx.fillText('RX', px + 8, py - 6);
      }
    }

    let lastRadar = { tx: [], rx: null, hint: null };

    function tickRadar() {
      drawRadar(lastRadar.tx, lastRadar.rx, lastRadar.hint);
      requestAnimationFrame(tickRadar);
    }

    async function poll() {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        if (s.coords && !document.getElementById('TX1_lat')) buildCoordForm(s.coords);
        if (charts.length !== s.corr.length) initCharts(s.corr.length);
        s.corr.forEach((c, i) => {
          charts[i].data.labels = c.x;
          charts[i].data.datasets[0].data = c.y;
          if (c.tau != null) {
            charts[i].data.datasets[1] = charts[i].data.datasets[1] || { type: 'scatter', data: [], borderColor: '#f85149', backgroundColor: '#f85149', pointRadius: 5, showLine: false };
            charts[i].data.datasets[1].data = [{ x: c.tau, y: c.peak }];
          }
          if (c.peak != null && c.peak > 0) {
            charts[i].options.scales.y.suggestedMax = c.peak * 1.4;
          }
          document.getElementById(`lbl${i}`).textContent = `${c.label}  |  tau=${c.tau}  mag=${c.peak?.toFixed(1)}`;
          charts[i].update('none');
        });
        document.getElementById('newtonOut').textContent = formatNewton(s.newton);

        lastRadar.tx = s.tx_xy || [];
        lastRadar.hint = s.rx_hint || null;
        lastRadar.rx = (s.newton && s.newton.pos) ? [s.newton.pos[0], s.newton.pos[1]] : null;
      } catch (e) { console.warn(e); }
      setTimeout(poll, 300);
    }

    initCharts(3);
    tickRadar();
    poll();
  </script>
</body>
</html>
